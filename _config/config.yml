---
name: cleaner_tinymce_config
---
SilverStripe\Forms\HTMLEditor\HTMLEditorField:
  default_rows: 12

SilverStripe\Security\Group:
  extensions:
    - Sunnysideup\CleanerTinyMCEConfig\Extensions\GroupEditorConfig

SilverStripe\Admin\LeftAndMain:
  extensions:
    - Sunnysideup\CleanerTinyMCEConfig\Extensions\HtmlEditorAdminExtension



SilverStripe\TinyMCE\TinyMCEConfig:
  # height of the editable area = rows x fixed_row_height (in px).
  # 12 rows x 30px = 360px (the framework default is 20px, which is too small).
  fixed_row_height: 30
  extensions:
    - Sunnysideup\CleanerTinyMCEConfig\Formats\TinyMCEConfigExtension

